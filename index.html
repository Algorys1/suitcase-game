<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff4df" />
    <link rel="icon" href="data:," />
    <title>Le monde tient dans une valise</title>
    <style>
      #loading-screen{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#ddc49e;color:#493322;font-family:Georgia,serif}
      #loading-screen[hidden]{display:none}
      .loading-desk{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.82)}
      .loading-bundle{position:relative;width:min(340px,82vw);text-align:center}
      .loading-case{width:150px;max-height:105px;object-fit:contain;filter:drop-shadow(0 7px 5px #49332255);margin-bottom:16px}
      .loading-paper{position:relative;padding:26px 24px 22px;background:#fff0d1;border:1px solid #a18156;box-shadow:2px 5px 0 #49332233;clip-path:polygon(0 0,94% 0,100% 16%,100% 84%,94% 100%,0 100%)}
      .loading-paper:after{content:'';position:absolute;right:10px;top:50%;width:7px;height:7px;border:3px solid #b6925b;border-radius:50%;background:#795839}
      #loading-copy{font-size:21px;font-weight:bold;margin:0 0 12px}
      #loading-detail{font-size:15px;line-height:1.4;margin:0 6px 18px 0}
      #loading-progress{height:5px;background:#d9c49e;border:1px solid #ac8b57;overflow:hidden;margin-right:8px}
      #loading-progress span{display:block;height:100%;width:0;background:#567e73}
      #loading-retry{margin:16px 0 0;padding:9px 18px;border:1px solid #927044;background:#ead0a0;color:#493322;font:bold 15px Georgia,serif}
    </style>
  </head>
  <body>
    <main id="game"></main>
    <div id="loading-screen" role="status" aria-live="polite">
      <img class="loading-desk" src="/assets/preparation/travel_desk.webp" alt="" />
      <div class="loading-bundle">
        <img class="loading-case" src="/assets/preparation/suitcase_closed.webp" alt="" />
        <div class="loading-paper">
          <p id="loading-copy" data-en="%LOADING_TITLE_EN%">%LOADING_TITLE_FR%</p>
          <p id="loading-detail" data-en="%LOADING_DETAIL_EN%">%LOADING_DETAIL_FR%</p>
          <div id="loading-progress" role="progressbar" aria-label="%LOADING_TITLE_FR%" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <button id="loading-retry" hidden>%LOADING_RETRY_FR%</button>
        </div>
      </div>
    </div>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('suitcase-game.progress.v1') || 'null');
        if (saved && saved.schemaVersion === 1 && saved.language === 'en') {
          document.documentElement.lang = 'en';
          document.querySelectorAll('[data-en]').forEach(function (node) { node.textContent = node.getAttribute('data-en'); });
          document.getElementById('loading-progress').setAttribute('aria-label', document.getElementById('loading-copy').textContent);
        }
      } catch (ignored) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
